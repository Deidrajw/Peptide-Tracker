name: Hybrid Preview Browser QA
on:
  push:
    branches: ['design/design-system-2-preview-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail fast on modular JavaScript syntax errors
        run: |
          set -e
          for file in assets/js/*-nexus.js; do node --check "$file"; done
      - name: Today card UX invariants
        run: node tools/validate-today-card-ux.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build current-commit isolated FULL-APP DEMO and LIVE package
        run: node tools/build-release.mjs
      - run: node tools/test-hybrid-preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-preview-screenshots
          path: tools/hybrid-*.png
