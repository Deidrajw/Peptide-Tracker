name: Nexus formulation WebKit validation
on:
  pull_request:
    branches: [main]
  # PR132 scoped QA branch trigger. Only test workflows; no main/release/deploy action.
  push:
    branches: ['docs/v0924-iphone-acceptance-ds2-reconcile-20261104']
    paths:
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/nexus-formulation-webkit.yml'
    # PR132 scoped QA branch trigger
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formulation-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate expanded research compound catalogue
        run: node tools/validate-library-expansion.mjs
      - name: Build complete fictional app demo
        run: node tools/build-release.mjs
      - name: Install WebKit browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps webkit
      - name: Validate Stash in WebKit iPhone viewport emulation
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/nexus-formulation-webkit-server.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8777/ >/dev/null && break; sleep 1; done
          NEXUS_BROWSER=webkit node tools/validate-formulation-stock.mjs
          NEXUS_BROWSER=webkit node tools/validate-retrospective-nasal.mjs
      - name: Upload WebKit picker and nasal visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-formulation-webkit-visual-evidence
          path: |
            dist/*_VISUAL_webkit_*.png
            dist/*_VISUAL_webkit_*.json
            dist/*_RETROSPECTIVE_webkit_*.png
          if-no-files-found: warn
          retention-days: 30
