name: Nexus Blend Combo and Vial BAC Regression
on:
  pull_request:
    paths:
      - 'assets/js/04-nexus.js'
      - 'assets/js/09-nexus.js'
      - 'tests/reconstitution-default-confirmation.test.cjs'
      - 'tests/blend-combo-vial-integrity.test.cjs'
      - 'tests/blend-combo-real-engine.test.cjs'
      - 'tests/vial-bac-historical-roundtrip.test.cjs'
      - '.github/workflows/nexus-blend-combo-regression.yml'
  workflow_dispatch:
jobs:
  blend-vial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JS syntax
        run: node --check assets/js/04-nexus.js
      - name: Fictional blend and vial BAC integrity regression
        run: |
          node tests/blend-combo-vial-integrity.test.cjs
          node tests/blend-combo-real-engine.test.cjs
          node tests/vial-bac-historical-roundtrip.test.cjs
          node tests/reconstitution-default-confirmation.test.cjs
