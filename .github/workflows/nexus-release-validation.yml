name: Nexus build and parity QA
on:
  push:
    branches: ['release/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and source validation
        shell: bash
        run: |
          set -e
          for file in assets/js/*-nexus.js tools/build-release.mjs tools/validate-release.mjs tools/validate-checkin.mjs tools/validate-protocol-design.mjs tools/validate-vial-safety.mjs tools/audit-measurement-math.mjs tools/validate-logdose-ui.mjs tools/validate-combo-picker.mjs tools/validate-stash-actions.mjs tools/validate-stash-cards.mjs tools/validate-chevron-unification.mjs tools/validate-blend-picker.mjs tools/validate-stash-panels.mjs tools/validate-plans-hierarchy.mjs tools/validate-recon-safety.mjs tools/validate-trust-ui.mjs tools/validate-formulation-stock.mjs tools/validate-ux-consistency.mjs; do node --check "$file"; done
          test "$(find assets/js -maxdepth 1 -name '*-nexus.js' | wc -l)" -eq 12
          grep -q 'nexus-disclosures.css' index.html
          grep -q 'nexus-contrast.css' index.html
          release_version="$(node -p "require('./release/release.json').version")"
          grep -Fq "<title>Nexus · ${release_version}</title>" index.html
          node --check assets/js/nexus-preparation-ledger.js
          node --check assets/js/nexus-preparation-bridge.js
          node --check assets/js/nexus-formulation-stock.js
          node tests/formulation-stock.test.cjs
          node tests/preparation-ledger.test.cjs
          node tests/preparation-bridge.test.cjs
          node --check assets/js/nexus-use-source-eligibility.js
          node tests/use-source-eligibility.test.cjs
          node tools/validate-recon-safety.mjs
          node tools/validate-ux-consistency.mjs
      - name: Gate stale release notes against changed application source
        shell: bash
        run: |
          node tools/check-release-readiness.mjs --self-test
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node tools/check-release-readiness.mjs --candidate
          else
            node tools/check-release-readiness.mjs --production
          fi
      - name: Verify Pages integrity checker against local source (NOT live deployment)
        run: python3 tools/verify-pages.py --smoke
      - name: Compare primary Cloudflare Pages files with source (required after merge)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 tools/verify-pages.py --attempts 1 --interval 0 --output dist/Nexus_CLOUDFLARE_PARITY.json
          else
            python3 tools/verify-pages.py --attempts 10 --interval 12 --output dist/Nexus_CLOUDFLARE_PARITY.json
          fi
      - name: Build exact-source LIVE and offline full-app DEMO
        run: node tools/build-release.mjs
      - name: Validate artifacts and required files
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, json
          version=json.loads(pathlib.Path('release/release.json').read_text())['version']
          z=pathlib.Path(f'dist/Nexus_{version}_LIVE_GitHub.zip')
          h=pathlib.Path(f'dist/Nexus_{version}_FULL_DEMO.html')
          o=pathlib.Path(f'dist/Nexus_{version}_OFFLINE_FULL_DEMO_OPEN_ME.zip')
          assert z.exists() and h.exists() and o.exists()
          with zipfile.ZipFile(o) as preview:
              assert preview.testzip() is None
              assert preview.namelist()==['index.html','README_OPEN_FIRST.txt']
              assert preview.read('index.html')==h.read_bytes()
              assert b'FICTIONAL FULL-APP DEMO' in preview.read('index.html')
              assert b'ChatGPT attachment viewer' in preview.read('README_OPEN_FIRST.txt')
          with zipfile.ZipFile(z) as a:
              names=a.namelist()
              assert 'index.html' in names and 'assets/css/nexus.css' in names and 'assets/css/nexus-disclosures.css' in names and 'assets/css/nexus-contrast.css' in names
              assert sum(n.startswith('assets/js/') and n.endswith('-nexus.js') for n in names)==12
              assert a.testzip() is None, "LIVE archive CRC failed"
              from hashlib import sha256
              for n in names:
                  if n.endswith('/'): continue
                  source=pathlib.Path(n)
                  assert source.is_file(), f"LIVE archive contains non-source path: {n}"
                  assert sha256(a.read(n)).digest()==sha256(source.read_bytes()).digest(), f"LIVE byte mismatch: {n}"
              print(f"LIVE exact checkout byte parity PASS: {len([n for n in names if not n.endswith('/')])} source files")
          s=h.read_text()
          assert 'buildDemoState("weight_loss")' in s
          assert 'window.__NEXUS_FULL_APP_DEMO__' in s
          assert '<script src="assets/js/' not in s
          assert '<link rel="stylesheet" href="assets/css/' not in s
          print('ZIP and standalone complete-source DEMO including browser-openable package PASS')
          PY
      - name: Browser QA at 320/390 and dark/light
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8777 >/tmp/nexus-server.log 2>&1 &
          node tools/validate-trust-ui.mjs
          node tools/validate-formulation-stock.mjs
          node tools/validate-release.mjs
          node tools/validate-checkin.mjs
          node tools/validate-protocol-design.mjs
          node tools/validate-vial-safety.mjs
          node tools/validate-logdose-ui.mjs
          node tools/validate-combo-picker.mjs
          node tools/validate-stash-actions.mjs
          node tools/validate-stash-cards.mjs
          node tools/validate-chevron-unification.mjs
          node tools/validate-blend-picker.mjs
          node tools/validate-stash-panels.mjs
          node tools/validate-plans-hierarchy.mjs
          node tools/audit-measurement-math.mjs
      - name: Upload demo, live ZIP, manifest and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-release-artifacts
          path: dist/
          if-no-files-found: warn
          retention-days: 30
