name: Historical Deadpool reconciliation (no-write)
on:
  push:
    branches:
      - docs/deadpool-historical-reconciliation-review-20261115
  pull_request:
    paths:
      - 'assets/js/nexus-historical-reconciliation.js'
      - 'assets/js/04-nexus.js'
      - 'index.html'
      - 'tests/historical-deadpool-reconciliation.cjs'
      - 'tools/validate-historical-review-ui.mjs'
      - '.github/workflows/historical-deadpool-reconciliation.yml'
jobs:
  isolated-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check assets/js/nexus-historical-reconciliation.js
          node --check assets/js/04-nexus.js
          node --check tests/historical-deadpool-reconciliation.cjs
      - name: Stage B correction module syntax (NOT mounted in app)
        run: |
          node --check assets/js/nexus-physical-stock-correction.js
          node --check tests/physical-stock-correction.cjs
      - name: Fictional gated correction and rollback assertions
        run: node tests/physical-stock-correction.cjs
      - name: Run fictional-data no-write regression
        run: node tests/historical-deadpool-reconciliation.cjs
      - name: Assert reader loads before Stash, with no reconciliation writer
        run: |
          node -e 'const s=require("fs").readFileSync("index.html","utf8");if(s.indexOf("nexus-historical-reconciliation.js")<0||s.indexOf("nexus-historical-reconciliation.js")>s.indexOf("04-nexus.js"))process.exit(1)'
          ! grep -E 'localStorage|saveState\(|nexusCommitCurrentState\(|fetch\(' assets/js/nexus-historical-reconciliation.js
          ! grep -E 'nexusCommitCurrentState\(|nexusWriter\(|saveState\(|localStorage.setItem\(' <(sed -n '/function nexusReviewHistoricalBlendVial(/,/^\/\/ Kit-level maintenance actions/p' assets/js/04-nexus.js)

      - name: Build exact-source full-app LIVE and isolated DEMO
        run: node tools/build-release.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start isolated local preview server
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/nexus-review-http.log 2>&1 &
          sleep 2
      - name: Read-only actual Stash review UI in fictional full app
        run: node tools/validate-historical-review-ui.mjs
      - name: Upload fictional review UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-review-browser-evidence
          path: dist/historical-review-browser-QA.json
          if-no-files-found: ignore
