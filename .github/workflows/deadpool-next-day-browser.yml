name: Nexus Deadpool next-day browser acceptance
on:
  pull_request:
    paths:
      - 'assets/js/**'
      - 'tools/validate-deadpool-next-day-ui.mjs'
      - '.github/workflows/deadpool-next-day-browser.yml'
  workflow_dispatch:
jobs:
  fictional-next-day:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact-source full app candidate
        run: node tools/build-release.mjs
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve isolated localhost source
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 > /tmp/nexus-deadpool-http.log 2>&1 &
          sleep 2
      - name: Actual dose form, durable save, reload, next-day dose
        run: node tools/validate-deadpool-next-day-ui.mjs
      - name: Upload fictional browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadpool-next-day-browser-results
          path: dist/deadpool-next-day-browser-QA.json
          if-no-files-found: ignore
